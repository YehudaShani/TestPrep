<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electrical Circuits Viewer</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1c1e21; --muted: #6b7280;
    --accent: #2563eb; --accent-text: #ffffff; --border: #d1d5db;
    --answer: #059669; --flag: #d97706;
    --done-bg: rgba(5, 150, 105, .14); --flag-bg: rgba(217, 119, 6, .14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --panel: #1f2229; --text: #e5e7eb; --muted: #9ca3af;
      --accent: #3b82f6; --accent-text: #ffffff; --border: #374151;
      --answer: #10b981; --flag: #f59e0b;
      --done-bg: rgba(16, 185, 129, .2); --flag-bg: rgba(245, 158, 11, .2);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 14px; max-width: 340px;
  }
  #toggle {
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    display: inline-flex;
  }
  #toggle button {
    border: 0; padding: 7px 18px; font-size: 14px; cursor: pointer;
    background: var(--panel); color: var(--muted);
  }
  #toggle button.active-q { background: var(--accent); color: var(--accent-text); }
  #toggle button.active-a { background: var(--answer); color: var(--accent-text); }
  #toggle button:disabled { opacity: .45; cursor: not-allowed; }
  #marks {
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    display: inline-flex;
  }
  #marks button {
    border: 0; padding: 7px 14px; font-size: 14px; cursor: pointer;
    background: var(--panel); color: var(--muted);
  }
  #marks button.active-done { background: var(--answer); color: var(--accent-text); }
  #marks button.active-flag { background: var(--flag); color: var(--accent-text); }
  #btn-share {
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px;
    font-size: 14px; cursor: pointer; background: var(--panel); color: var(--muted);
  }
  #btn-share.copied { background: var(--answer); color: var(--accent-text); border-color: var(--answer); }
  .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { flex: 1; display: flex; min-height: 0; }
  nav {
    width: 190px; padding: 12px; overflow-y: auto;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  nav h2 { font-size: 12px; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  #qgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #qgrid button {
    position: relative; padding: 8px 0; border: 1px solid var(--border);
    border-radius: 6px; background: var(--bg); color: var(--text);
    font-size: 13px; cursor: pointer;
  }
  #qgrid button.done { background: var(--done-bg); border-color: var(--answer); }
  #qgrid button.flagged { background: var(--flag-bg); box-shadow: inset 0 0 0 2px var(--flag); }
  #qgrid button.done.flagged { background: var(--done-bg); }
  #qgrid button.current { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  #qgrid button .dot {
    position: absolute; top: 3px; right: 4px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--answer);
  }
  #viewer {
    flex: 1; overflow: auto; padding: 20px; display: flex;
    flex-direction: column; align-items: center; gap: 10px;
  }
  #status { color: var(--muted); }
  #page-img {
    max-width: 900px; width: 100%; background: #fff; border-radius: 6px;
    box-shadow: 0 1px 8px rgba(0,0,0,.25);
  }
  #banner {
    align-self: stretch; max-width: 900px; margin: 0 auto; width: 100%;
    display: flex; justify-content: space-between; align-items: center;
  }
  #banner .mode-q { color: var(--accent); font-weight: 600; }
  #banner .mode-a { color: var(--answer); font-weight: 600; }
  .navbtn {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px;
  }
  .navbtn:disabled { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>📚 Electrical Circuits</h1>
  <select id="exam-select" title="Exam"></select>
  <span id="toggle">
    <button id="btn-q">Question</button>
    <button id="btn-a">Answer</button>
  </span>
  <span id="marks">
    <button id="btn-done" title="mark as answered (D)">✓ Done</button>
    <button id="btn-flag" title="flag as difficult (F)">⚑ Hard</button>
  </span>
  <button id="btn-share" title="copy a link to this question">🔗 Share</button>
  <span class="hint">Space: question/answer &nbsp;·&nbsp; ←/→: prev/next &nbsp;·&nbsp; D: done &nbsp;·&nbsp; F: hard</span>
</header>
<main>
  <nav>
    <h2>Questions</h2>
    <div id="qgrid"></div>
  </nav>
  <div id="viewer" tabindex="0">
    <div id="banner">
      <button class="navbtn" id="prev-btn">← Prev</button>
      <span id="status">Loading…</span>
      <button class="navbtn" id="next-btn">Next →</button>
    </div>
    <img id="page-img" alt="" hidden>
  </div>
</main>
<script>
"use strict";
// Flipped to true by build_site.py: images and exams.json are then static
// files and progress lives in each visitor's localStorage.
window.STATIC_SITE = false;
const STATIC = window.STATIC_SITE;
const STORAGE_KEY = "study-progress";
let exams = [];
let progress = {};
let state = { exam: null, n: null, mode: "q" };

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const fileFor = (mode, n) => (mode === "q" ? "question_" : "answer_") + pad(n) + ".pdf";
const renderUrl = (exam, mode, n) =>
  STATIC
    ? "img/" + encodeURIComponent(exam.dir) + "/"
      + (mode === "q" ? "question_" : "answer_") + pad(n) + ".png"
    : "/api/render?exam=" + encodeURIComponent(exam.dir) + "&file=" + encodeURIComponent(fileFor(mode, n));

function currentExam() {
  return exams.find((e) => e.dir === state.exam) || null;
}

function hasAnswer(exam, n) {
  return exam && exam.answers.includes(n);
}

function markOf(dir, n) {
  return (progress[dir] || {})[n] || {};
}

function saveMark(done, flagged) {
  const dir = state.exam;
  const n = state.n;
  if (!dir || n === null) return;
  if (done || flagged) {
    (progress[dir] = progress[dir] || {})[n] = { done, flagged };
  } else if (progress[dir]) {
    delete progress[dir][n];
  }
  if (STATIC) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } else {
    fetch("/api/progress", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ exam: dir, n, done, flagged }),
    });
  }
  refreshMarks();
}

function toggleDone() {
  const m = markOf(state.exam, state.n);
  saveMark(!m.done, !!m.flagged);
}

function toggleFlag() {
  const m = markOf(state.exam, state.n);
  saveMark(!!m.done, !m.flagged);
}

function doneCount(exam) {
  const marks = progress[exam.dir] || {};
  return exam.questions.filter((n) => marks[n] && marks[n].done).length;
}

function optionLabel(exam) {
  return exam.label + " (" + doneCount(exam) + "/" + exam.questions.length + " ✓)";
}

function refreshMarks() {
  const exam = currentExam();
  if (!exam) return;
  for (const btn of $("qgrid").children) {
    const m = markOf(exam.dir, Number(btn.dataset.n));
    btn.classList.toggle("done", !!m.done);
    btn.classList.toggle("flagged", !!m.flagged);
  }
  const m = markOf(exam.dir, state.n);
  $("btn-done").className = m.done ? "active-done" : "";
  $("btn-flag").className = m.flagged ? "active-flag" : "";
  for (const opt of $("exam-select").options) {
    const e = exams.find((x) => x.dir === opt.value);
    if (e) opt.textContent = optionLabel(e);
  }
}

function show() {
  const exam = currentExam();
  if (!exam || state.n === null) return;
  const img = $("page-img");
  img.hidden = false;
  img.src = renderUrl(exam, state.mode, state.n);
  const label = state.mode === "q" ? "Question" : "Answer";
  $("status").innerHTML =
    '<span class="mode-' + state.mode + '">' + label + " " + state.n + "</span>" +
    ' <span>· ' + exam.label + "</span>" +
    (state.mode === "q" && !hasAnswer(exam, state.n) ? " · <em>no answer file</em>" : "");
  $("btn-q").className = state.mode === "q" ? "active-q" : "";
  $("btn-a").className = state.mode === "a" ? "active-a" : "";
  $("btn-a").disabled = !hasAnswer(exam, state.n);
  const idx = exam.questions.indexOf(state.n);
  $("prev-btn").disabled = idx <= 0;
  $("next-btn").disabled = idx >= exam.questions.length - 1;
  for (const btn of $("qgrid").children) {
    btn.classList.toggle("current", Number(btn.dataset.n) === state.n);
  }
  // Preload the counterpart so toggling is instant.
  const other = state.mode === "q" ? "a" : "q";
  if (other === "q" || hasAnswer(exam, state.n)) {
    new Image().src = renderUrl(exam, other, state.n);
  }
  history.replaceState(null, "",
    "#" + encodeURIComponent(state.exam) + "/" + state.n + "/" + state.mode);
  refreshMarks();
}

// Deep link: #<exam-dir>/<question>[/<q|a>], kept in sync by show().
function applyHash() {
  const m = /^#([^/]+)\/(\d+)(?:\/(q|a))?$/.exec(location.hash);
  if (!m) return false;
  const dir = decodeURIComponent(m[1]);
  const exam = exams.find((e) => e.dir === dir);
  const n = Number(m[2]);
  if (!exam || !exam.questions.includes(n)) return false;
  state.exam = dir;
  $("exam-select").value = dir;
  buildGrid();
  selectQuestion(n, m[3] === "a" && hasAnswer(exam, n) ? "a" : "q");
  return true;
}

function selectQuestion(n, mode) {
  state.n = n;
  state.mode = mode || "q";
  show();
}

function buildGrid() {
  const exam = currentExam();
  const grid = $("qgrid");
  grid.innerHTML = "";
  if (!exam) return;
  for (const n of exam.questions) {
    const btn = document.createElement("button");
    btn.dataset.n = n;
    btn.textContent = n;
    if (hasAnswer(exam, n)) {
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.title = "answer available";
      btn.appendChild(dot);
    }
    btn.onclick = () => selectQuestion(n);
    grid.appendChild(btn);
  }
}

function selectExam(dir) {
  state.exam = dir;
  buildGrid();
  const exam = currentExam();
  selectQuestion(exam ? exam.questions[0] : null);
}

function step(delta) {
  const exam = currentExam();
  if (!exam) return;
  const idx = exam.questions.indexOf(state.n) + delta;
  if (idx >= 0 && idx < exam.questions.length) selectQuestion(exam.questions[idx]);
}

function toggleMode() {
  const exam = currentExam();
  if (state.mode === "q" && !hasAnswer(exam, state.n)) return;
  state.mode = state.mode === "q" ? "a" : "q";
  show();
}

// Blur after click so a focused button never swallows the Space shortcut.
$("btn-q").onclick = (e) => { state.mode = "q"; show(); e.currentTarget.blur(); };
$("btn-a").onclick = (e) => { state.mode = "a"; show(); e.currentTarget.blur(); };
$("btn-done").onclick = (e) => { toggleDone(); e.currentTarget.blur(); };
$("btn-flag").onclick = (e) => { toggleFlag(); e.currentTarget.blur(); };
$("prev-btn").onclick = (e) => { step(-1); e.currentTarget.blur(); };
$("next-btn").onclick = (e) => { step(1); e.currentTarget.blur(); };
$("exam-select").onchange = (e) => { selectExam(e.target.value); e.target.blur(); };
function copyToClipboard(text) {
  const viaCommand = () => new Promise((resolve, reject) => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    ok ? resolve() : reject(new Error("copy failed"));
  });
  return navigator.clipboard
    ? navigator.clipboard.writeText(text).catch(viaCommand)
    : viaCommand();
}

$("btn-share").onclick = (e) => {
  const btn = e.currentTarget;
  copyToClipboard(location.href)
    .then(() => { btn.textContent = "✓ Copied!"; btn.classList.add("copied"); })
    .catch(() => { btn.textContent = "Copy failed"; })
    .then(() => setTimeout(() => {
      btn.textContent = "🔗 Share";
      btn.classList.remove("copied");
    }, 1500));
  btn.blur();
};
window.addEventListener("hashchange", applyHash);

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === "Space") { e.preventDefault(); toggleMode(); }
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.code === "KeyD") toggleDone();
  else if (e.code === "KeyF") toggleFlag();
});

Promise.all(
  STATIC
    ? [
        fetch("exams.json").then((r) => r.json()),
        Promise.resolve(JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}")),
      ]
    : [
        fetch("/api/exams").then((r) => r.json()),
        fetch("/api/progress").then((r) => r.json()),
      ]
)
  .then(([data, prog]) => {
    exams = data;
    progress = prog;
    const sel = $("exam-select");
    for (const e of exams) {
      const opt = document.createElement("option");
      opt.value = e.dir;
      opt.textContent = e.label + " (" + e.questions.length + " questions)";
      sel.appendChild(opt);
    }
    if (!applyHash()) {
      if (exams.length) selectExam(exams[0].dir);
      else $("status").textContent = "No split exams found in the Split directory.";
    }
  });
</script>
</body>
</html>
