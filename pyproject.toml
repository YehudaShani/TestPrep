[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-splitter"
version = "0.1.0"
description = "Desktop tool to split PDF pages horizontally at click-defined lines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "Pillow>=10.0.0",
    "PyQt6>=6.6.0",
]

[project.scripts]
pdf-splitter = "pdf_splitter.main:main"

[tool.setuptools.packages.find]
where = ["src"]
